<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="ite4style.css">
</head>
<body>

    <div class="container">
        <div class="login-card">
            <!-- Logo & Heading -->
            <div class="header">
                <div class="logo"></div>
                <h1>ITE4 Demo Log-In Page</h1>
            </div>

            <!-- Form -->
            <form id="loginForm" novalidate>
                <!-- Username/Email Input -->
                <div class="input-group">
                    <label for="username" class="input-label">Username or Email</label>
                    <div class="input-wrapper">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0a2.25 2.25 0 0 0-2.25-2.25h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.909a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                        </svg>
                        <input type="text" id="username" name="username" class="input-field" placeholder="Enter your username or email" required>
                    </div>
                    <small class="error-msg" id="usernameError">Please enter your username or email.</small>
                </div>

                <!-- Password Input with Show/Hide Toggle -->
                <div class="input-group">
                    <label for="password" class="input-label">Password</label>
                    <div class="input-wrapper password-wrapper">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5A2.25 2.25 0 0 0 19.5 19.5v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                        </svg>
                        <input type="password" id="password" name="password" class="input-field" placeholder="Enter your password" required>
                        <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Show password" aria-controls="password">
                            <svg class="eye-icon eye-icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.644C3.423 7.51 7.36 4.5 12 4.5s8.577 3.01 9.964 7.178a1.012 1.012 0 0 1 0 .644C20.577 16.49 16.64 19.5 12 19.5s-8.577-3.01-9.964-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                            <svg class="eye-icon eye-icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.864-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.774 3.162 10.066 7.5a10.522 10.522 0 0 1-4.293 5.773M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.895 7.895L21 21m-3.227-3.227-3.651-3.651m0 0a3 3 0 0 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                    <small class="error-msg" id="passwordError">Please enter your password.</small>
                </div>

                <!-- Remember Me -->
                <div class="remember-forgot">
                    <label for="remember" class="remember-label">
                        <input type="checkbox" id="remember" name="remember" class="remember-checkbox">
                        Remember Me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginBtn" class="login-btn">
                    Login
                    <span class="btn-loader" id="btnLoader"></span>
                </button>

                <!-- Message Area -->
                <div class="message" id="message" role="alert" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <script src="ite4script.js"></script>
</body>
</html>
