<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="ite4style.css">
</head>
<body>

    <div class="container">
        <div class="login-card">
            <!-- Logo & Heading -->
            <div class="header">
                <div class="logo"></div>
                <h1>ITE 4 Login</h1>
            </div>

            <!-- Form -->
            <form id="loginForm" novalidate>
                <!-- Username/Email Input -->
                <div class="input-group">
                    <label for="username" class="input-label">Username or Email</label>
                    <input type="text" id="username" name="username" class="input-field" placeholder="Enter your username or email" required>
                    <small class="error-msg" id="usernameError">Please enter your username or email.</small>
                </div>

                <!-- Password Input with Show/Hide Toggle -->
                <div class="input-group">
                    <label for="password" class="input-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="input-field" placeholder="Enter your password" required>
                        <div class="eye-toggle" id="eyeToggle" aria-label="Show password">
                            <svg class="eye-icon open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                                <line x1="1" y1="23" x2="23" y2="1"></line>
                            </svg>
                            <svg class="eye-icon closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                                <line x1="1" y1="23" x="23" y2="1"></line>
                            </svg>
                        </div>
                    </div>
                    <small class="error-msg" id="passwordError">Please enter your password.</small>
                </div>

                <!-- Remember Me -->
                <div class="remember-forgot">
                    <label for="remember" class="remember-label">
                        <input type="checkbox" id="remember" name="remember" class="remember-checkbox">
                        Remember Me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginBtn" class="login-btn">
                    Login
                    <span class="btn-loader" id="btnLoader"></span>
                </button>

                <!-- Message Area -->
                <div class="message" id="message" role="alert" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <script src="ite4script.js"></script>
</body>
</html>
